nombre: Machine
plural: Machines
icono: server
descripcion: Physical servers, virtual machines and VPS. The id is the hostname in lowercase

etiqueta: name

campos:
  name:
    tipo: texto
    opcional: true
    descripcion: Only when it is written differently from the id (PVE-01)
  ip:
    tipo: ip
  location:
    tipo: ref
    a: locations
  kind:
    tipo: enum
    valores: [physical, vm, vps]
  host:
    tipo: ref
    a: machines
    opcional: true
    descripcion: The physical machine it runs on, for a vm
  os:
    tipo: texto
    descripcion: Operating system and version (Debian 13)
  purpose:
    tipo: texto
    descripcion: One line on what it is for
  page:
    tipo: ficha
    opcional: true
    descripcion: The page that explains it, if there is one

vista:
  columnas: [name, ip, kind, location, purpose]
