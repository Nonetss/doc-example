nombre: Header field
plural: Header fields
icono: heading
descripcion: The fields every page header accepts without declaring them. The id is the field as written

campos:
  required:
    tipo: booleano
    descripcion: Whether a page without it is reported
  kind:
    tipo: ref
    a: field-kinds
    descripcion: The kind of its value
  meaning:
    tipo: texto
    descripcion: What it is for, and where it shows
  rule:
    tipo: texto
    opcional: true
    descripcion: The rule its value follows, when the kind says too little

vista:
  columnas: [id, required, kind, meaning]
