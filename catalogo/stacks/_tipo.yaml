nombre: Stack
plural: Stacks
icono: layers
descripcion: Every Docker Compose project on a server. The id is the server and the project (docker-01-adguard)

etiqueta: name

campos:
  name:
    tipo: texto
    descripcion: The compose project name
  server:
    tipo: ref
    a: machines
  origin:
    tipo: enum
    valores: [komodo, compose]
    descripcion: komodo for a Komodo stack, compose for one set up by hand
  service:
    tipo: ref
    a: services
    opcional: true
    descripcion: The documented service this stack runs
  containers:
    tipo: lista
    de:
      tipo: objeto
      campos:
        name:
          tipo: texto
        image:
          tipo: texto
        ports:
          tipo: lista
          de: { tipo: texto }
          opcional: true
          descripcion: Published:internal (8080:80)
        volumes:
          tipo: lista
          de: { tipo: texto }
          opcional: true
          descripcion: Server folder:container path

vista:
  columnas: [name, server, origin, service]
