name: duplicati
server: docker-01
origin: komodo
service: duplicati
containers:
  - name: duplicati
    image: lscr.io/linuxserver/duplicati:2.1.0
    ports: ["8200:8200"]
    volumes:
      - /srv/duplicati/config:/config
      - /srv:/source:ro
      - /mnt/nas/backups:/backups
fuente: komodo
actualizado: 2026-10-15
