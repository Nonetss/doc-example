titulo: De un push al sitio publicado
descripcion: Quien escribe hace push al repositorio de contenido, la plataforma lo sincroniza y lo valida, y lo publica para el lector, el editor y los agentes de IA
direccion: derecha
nodos:
  writer: { nombre: Autor, sub: una persona o un agente, tipo: entrada }
  repo: { nombre: Repositorio de contenido, sub: git, tipo: almacen }
  platform: { nombre: Plataforma, sub: sincroniza y valida }
  reader: { nombre: Lector, sub: "la web, para personas" }
  editor: { nombre: Editor, sub: autocompletado de YAML }
  agents: { nombre: Agentes de IA, sub: llms.txt y llm.txt }
conexiones:
  - writer -> repo: git push
  - repo -> platform: sincroniza al hacer push, o cada cinco minutos
  - platform -> reader: páginas, menú y páginas del catálogo
  - platform -> editor: el catálogo de esquemas
  - platform -> agents: cada página como Markdown
zonas:
  yours: { titulo: Tu lado, nodos: [writer, repo, editor] }
  platform: { titulo: La plataforma, nodos: [platform, reader, agents] }
