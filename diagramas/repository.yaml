titulo: Qué contiene un repositorio de contenido
descripcion: Las declaraciones dicen qué puede contener el contenido y cómo se muestra; las páginas citan las entidades y muestran los diagramas
direccion: derecha
nodos:
  config: { entidad: files/doc-config }
  menu: { entidad: files/menu }
  types: { entidad: files/type-declaration }
  pages: { entidad: files/page }
  entities: { entidad: files/entity }
  diagrams: { entidad: files/diagram-file }
conexiones:
  - config -> pages: declara los campos adicionales de su cabecera
  - menu -> pages: las agrupa y ordena en la barra lateral
  - types -> entities: declaran sus campos
  - pages -> entities: las citan con enlaces catalogo y campos de cabecera
  - pages -> diagrams: los muestran con el componente Diagram
  - diagrams -> entities: las usan como nodos
zonas:
  declarations: { titulo: Declaraciones, nodos: [config, menu, types] }
  content: { titulo: Contenido, nodos: [pages, entities, diagrams] }
