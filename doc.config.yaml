# Site configuration. Everything else (menu, sections, catalog) comes from the
# folders: docs/ holds the pages and catalogo/ the structured data.
#
# The keys of this file and of every _tipo.yaml (nombre, cabecera, campos,
# tipo: texto...) are the platform's contract and are read as they are. The
# values, the type ids and the field names are this site's own.

nombre: Homelab
descripcion: Documentation of the home servers, services and backups
plataforma: "1" # major version of the platform contract this site targets

# Extra header fields for the pages. The platform already gives every page
# titulo, descripcion, icono, orden and actualizado. These use the same field
# kinds as the catalog (see catalogo/*/_tipo.yaml).
cabecera:
  services:
    tipo: lista
    de: { tipo: ref, a: services }
    opcional: true
    descripcion: Services the page is about
  machines:
    tipo: lista
    de: { tipo: ref, a: machines }
    opcional: true
    descripcion: Machines the page is about
  open_questions:
    tipo: lista
    de: { tipo: texto }
    opcional: true
    descripcion: Questions still open; a question round answers them (/questions)
